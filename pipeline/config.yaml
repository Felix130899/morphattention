# Part 1 of the pipeline for your own dataset: raw images -> labels -> masks ->
# drops -> split -> manifest. Neutral start: plain Grounding DINO + SAM, every
# mask fix off, no drop rule, no decisions yet. The thesis run (NHM Wien,
# setting D, Neo's decisions) is pipeline/config_thesis_nhm.yaml.
#
#     python scripts/run_part1.py                      # everything, with this file
#     python scripts/run_part1.py --steps labels,segment
#     python scripts/run_part1.py --dry-run            # print the commands only
#
# Before the first run:
#   1. put your images under raw_dir, one subfolder per domain (e.g. photos/, xrays/)
#      and list those subfolders under "domains" below
#   2. write your labels CSV (block "labels" below)
#   3. cp -r pipeline/decisions_template <decisions_dir>, then per domain
#      mv mask_drops_DOMAIN.tsv mask_drops_<domain>.tsv (header only = no decisions)
#
# The mask review + error report are not in it: they are the human step between
# "segment" and "merge" (scripts/review/review_masks.py, scripts/review/error_report.py). Their
# outcome comes back as rows in the decision files, or as a changed setting below
# and a rerun under a new name.

# Run name. Outputs under processed_dir:
#   segmented/<name>_full/<domain>/   segment_fish.py run (every image)
#   segmented/<name>/<domain>/        curated run (drops applied)
#   labels_<name>.csv                 labels with the label decisions applied
#   split/<name>_seed<seed>/          specimen split
#   manifest/<name>_seed<seed>/       manifest.csv, the input for training
name: my_dataset

raw_dir: data/raw/my_dataset           # one subfolder per domain
processed_dir: data/processed
decisions_dir: pipeline/decisions_my_dataset   # your copy of pipeline/decisions_template/
hash_cache: data/processed/sha256_cache.json

# Where the labels come from (step "labels"):
#   source: csv            your own CSV, one row per image (scripts/pipeline/import_labels.py):
#                          file_name (relative to raw_dir, e.g. photos/a.jpg), the
#                          specimen column, and your label columns (e.g. species, origin)
#   source: nhm_filenames  the thesis route: labels parsed from NHM Wien file names
#                          (scripts/pipeline/extract_labels.py, see config_thesis_nhm.yaml)
# Fixes to messy labels go into <decisions_dir>/labels/value_renames.tsv and
# image_fixes.tsv (pipeline/decisions_template/README.md), not into the CSV,
# so every change stays visible.
labels:
  source: csv
  path: data/raw/my_dataset/labels.csv
  specimen: specimen            # column with the specimen (one physical object, e.g. one fish): its images
                                # stay in one split. "none" only if you have no specimen information: every
                                # image is then its own specimen, and the split warns about it

# segment_fish.py settings for every domain (python scripts/pipeline/segment_fish.py --help
# has the details). Detection first, then the mask fixes, all off here; the
# value the thesis used is behind "thesis". Switch one fix on at a time, rerun
# under a new name and compare the two runs in the review, so you know which
# setting fixed (or broke) what.
segment:
  # detection
  dino_text: "fish."            # Grounding DINO prompt: lowercase, each concept ending in a period
  dino_box_threshold: 0.35      # min. box confidence; lower finds more fish and more false boxes. thesis 0.35
  # mask fixes
  mask_threshold: 0.0           # SAM logit cut; below 0 keeps more of thin, translucent fins. thesis -1.0
  min_component_frac: 0         # drop specks below this fraction of the mask. thesis 0.01
  bleed_outside_frac: 0         # mask bleeding out of its box by more than this -> replace it. thesis 0.02
  bleed_max_box_edge: 0.1       # used by the bleed fix only; tightly cropped images need more. thesis 0.1 photos, 0.3 X-rays
  wrong_region_fix: false       # re-prompt SAM when the mask is the background around the fish. thesis true
  keep_near_frac: 0             # drop small pieces far from the fish (labels, rulers). thesis 0.02
  fill_holes_frac: 0            # fill small holes (speckled fins, X-ray grids). thesis 0.02

# One entry per subfolder of raw_dir. "label": name in the reports (default:
# the folder name). "segment": settings that differ from the block above for
# this domain. "qa_rule": a drop rule on the QA fields of each mask, applied in
# "merge" (null = none; B = the thesis X-ray rule, see merge_runs.py qa_rule_b).
domains:
  photos:
    label: Photos
    segment: {}
    qa_rule: null

# Train / val / test split by specimen (images of one specimen stay together).
#   class   what the model learns: genus (first word of the species), binomial
#           (genus + epithet; "sp.", "cf.", abbreviated epithets have none); both
#           need a species column. Or any of your label columns as written, e.g.
#           species, origin. Images without a value are left out
#           (split/<...>/dropped_no_class.txt).
split:
  class: genus
  seed: 0
  val_frac: 0.15
  test_frac: 0.15
  min_specimens: 5                       # specimen groups a class needs in a domain to be evaluated there

# Footer line of the review reports, e.g. image source and licence (null = none).
attribution: null

# Mask review (scripts/review/review_masks.py) and its reports (scripts/review/error_report.py,
# scripts/review/compare_report.py).
#   categories  error types, keys 1-9 on the review page in this order (max 9).
#               Name them once and keep them: the names go into the recorded
#               decisions, and a started review refuses a changed list. Add your
#               own, e.g. split missing_part into missing_fin + missing_tail
#               ("missing_<part>"). "highlight: true" adds a result tile.
#   fixes       what to change in the segment block above if a category has to
#               come down: setting, which way to turn it, what it costs. The
#               reports show it next to the value the run used. Without "fixes"
#               a category shows "no advice in the config".
review:
  max_rate: 0.10                         # accepted if error rate (fix + drop) / judged <= this
  categories:
    - name: bleed
      text: background, shadow, tray, text or tag inside the mask; can leak label information into training
      highlight: true
      fixes:
        - {setting: bleed_outside_frac, turn: "switch on, e.g. 0.02: replace a mask that leaks out of its box",
           cost: "replacement masks are tighter: more missing_part / partial"}
        - {setting: wrong_region_fix, turn: "switch on: re-prompt when the mask is the background around the object",
           cost: "can pick an inner part of unusual specimens (e.g. dissected)"}
        - {setting: keep_near_frac, turn: "switch on, e.g. 0.02: drop small pieces far from the object (labels, rulers)",
           cost: can drop real detached parts}
        - {setting: (none), turn: "objects touching the specimen (tags, rods)", cost: "no setting separates them; drop the image"}
    - name: wrong_object
      text: mask on something that is not the object
      fixes:
        - {setting: dino_box_threshold, turn: "higher: fewer, surer boxes", cost: more missed_object}
        - {setting: dino_text, turn: narrower prompt, cost: more missed_object}
    - name: merged
      text: two or more objects in one mask
      fixes:
        - {setting: dino_box_threshold, turn: "higher: fewer boxes spanning two objects", cost: more missed_object}
    - name: partial
      text: only part of the object masked
      fixes:
        - {setting: mask_threshold, turn: "lower, e.g. -1: larger masks", cost: more bleed}
        - {setting: candidate, turn: largest instead of score, cost: can include background (bleed)}
    - name: missed_object
      text: an object in the image has no mask
      fixes:
        - {setting: dino_box_threshold, turn: "lower, e.g. 0.25-0.30: more boxes", cost: more wrong_object}
        - {setting: dino_text, turn: "add terms for the missed kind, e.g. 'fish. eel.'", cost: more boxes on non-targets}
        - {setting: dedup_containment, turn: "higher: keeps a small object lying inside another's box",
           cost: more duplicate masks}
    - name: missing_part
      text: a part of the object missing (e.g. a fin), or holes in the mask
      fixes:
        - {setting: mask_threshold, turn: "lower, e.g. -1: keeps thin, translucent parts", cost: "masks grow everywhere: more bleed"}
        - {setting: fill_holes_frac, turn: "switch on, e.g. 0.02: fill small holes", cost: can close real gaps}
        - {setting: fin_threshold, turn: "set below mask_threshold, e.g. -6: add faint parts touching the mask",
           cost: "can add background; capped by fin_max_growth"}
  caveats: []                            # extra lines for the reports' caveat section
